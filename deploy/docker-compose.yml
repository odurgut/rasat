services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: rasat
      CLICKHOUSE_USER: rasat
      CLICKHOUSE_PASSWORD: rasat
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  rasat:
    image: odurgut/rasat:0.1.0
    ports:
      - "8080:8080"
      - "4317:4317"
    environment:
      RASAT_HTTP_ADDR: ":8080"
      RASAT_GRPC_ADDR: ":4317"
      RASAT_LOG_LEVEL: info
      RASAT_LOG_FORMAT: json
      RASAT_SHUTDOWN_TIMEOUT: 15s
      RASAT_HTTP_MAX_BODY: "16777216"
      RASAT_CLICKHOUSE_ADDR: clickhouse:9000
      RASAT_CLICKHOUSE_DATABASE: rasat
      RASAT_CLICKHOUSE_USER: rasat
      RASAT_CLICKHOUSE_PASSWORD: rasat
      RASAT_CLICKHOUSE_PING_TIMEOUT: 2s
      RASAT_CLICKHOUSE_DIAL_TIMEOUT: 5s
      RASAT_CLICKHOUSE_MIGRATE_TIMEOUT: 30s
      RASAT_CLICKHOUSE_INSERT_TIMEOUT: 30s
      RASAT_CLICKHOUSE_QUERY_TIMEOUT: 10s
      RASAT_QUERY_MAX_WINDOW: 168h
      RASAT_STREAM_BUFFER: "64"
      RASAT_STREAM_MAX_CLIENTS: "64"
      RASAT_STREAM_WRITE_TIMEOUT: 10s
      RASAT_STREAM_MAX_PER_SEC: "100"
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

volumes:
  clickhouse-data:
