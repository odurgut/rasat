# Re-fire demo.rasat.dev for a tag already on Hub. Does not build an image.
# Same token and command as release.yml dispatch-demo.

name: dispatch-demo

on:
  workflow_dispatch:
    inputs:
      tag:
        description: rasat git tag (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger odurgut/rasat-demo
        env:
          GH_TOKEN: ${{ secrets.DEMO_DISPATCH_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "need vMAJOR.MINOR.PATCH, got ${TAG:-empty}" >&2
            exit 1
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "DEMO_DISPATCH_TOKEN unset" >&2
            exit 1
          fi
          gh workflow run deploy --repo odurgut/rasat-demo --ref main -f "tag=${TAG}"
