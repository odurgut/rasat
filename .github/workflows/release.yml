# Push odurgut/rasat to Docker Hub on a version tag (v1.2.3).
# latest is set only from those tags, never from main.
#
# Hub credentials live on the GitHub Environment named DOCKERHUB:
# DOCKERHUB_USERNAME, DOCKERHUB_TOKEN

name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go test -race -count=1 ./...
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci && npm run build
      - run: make build

  docker:
    needs: test
    runs-on: ubuntu-latest
    environment: DOCKERHUB
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: odurgut/rasat
          labels: |
            org.opencontainers.image.title=Rasat
            org.opencontainers.image.description=Self-hosted observability for OpenTelemetry traces, logs, and a service map
            org.opencontainers.image.url=https://rasat.dev
            org.opencontainers.image.documentation=https://rasat.dev/docs/getting-started
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.vendor=odurgut
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
      - name: Update Docker Hub overview
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: bash deploy/push-hub-overview.sh

  github-release:
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true

  # Overwrite demo.rasat.dev from the same tag. Must not fail Hub.
  dispatch-demo:
    needs: docker
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Trigger odurgut/rasat-demo
        env:
          GH_TOKEN: ${{ secrets.DEMO_DISPATCH_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "DEMO_DISPATCH_TOKEN unset; skip demo.rasat.dev"
            exit 0
          fi
          gh api --method POST repos/odurgut/rasat-demo/dispatches \
            -f event_type=rasat-release \
            -F "client_payload[tag]=${TAG}"
