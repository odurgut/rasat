# Push the Hub Overview (short description + this markdown) on main.
# Image builds still happen only on version tags (release.yml).

name: hub-readme

on:
  push:
    branches: [main]
    paths:
      - deploy/docker-hub.md
      - deploy/push-hub-overview.sh
      - .github/workflows/hub-readme.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dockerhub:
    runs-on: ubuntu-latest
    environment: DOCKERHUB
    steps:
      - uses: actions/checkout@v5
      - name: Update Docker Hub overview
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: bash deploy/push-hub-overview.sh
